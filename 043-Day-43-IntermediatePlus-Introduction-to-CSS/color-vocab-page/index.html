<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colors · Farben — Flashcards</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="page-header">
      <div class="container">
        <p class="eyebrow">Flashcards</p>
        <h1>Colors <span class="dot">·</span> Farben</h1>
        <p class="subtitle">Click a card to reveal the German name.</p>

        <div class="controls">
          <button id="flipAll" type="button" class="btn">Flip All</button>
          <button id="resetAll" type="button" class="btn btn-ghost">
            Reset
          </button>
          <span id="counter" class="counter">0 / 20 flipped</span>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="grid" id="grid">
        <button class="card" type="button" style="--c: #ff0000">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Red</span>
              <span class="name de">Rot</span>
            </span>
            <span class="meta">#FF0000 · 255, 0, 0</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #0000ff">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Blue</span>
              <span class="name de">Blau</span>
            </span>
            <span class="meta">#0000FF · 0, 0, 255</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #008000">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Green</span>
              <span class="name de">Grün</span>
            </span>
            <span class="meta">#008000 · 0, 128, 0</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #ffff00">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Yellow</span>
              <span class="name de">Gelb</span>
            </span>
            <span class="meta">#FFFF00 · 255, 255, 0</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #ffa500">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Orange</span>
              <span class="name de">Orange</span>
            </span>
            <span class="meta">#FFA500 · 255, 165, 0</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #800080">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Purple</span>
              <span class="name de">Lila / Violett</span>
            </span>
            <span class="meta">#800080 · 128, 0, 128</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #ffc0cb">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Pink</span>
              <span class="name de">Rosa</span>
            </span>
            <span class="meta">#FFC0CB · 255, 192, 203</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #a52a2a">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Brown</span>
              <span class="name de">Braun</span>
            </span>
            <span class="meta">#A52A2A · 165, 42, 42</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #000000">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Black</span>
              <span class="name de">Schwarz</span>
            </span>
            <span class="meta">#000000 · 0, 0, 0</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #ffffff">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">White</span>
              <span class="name de">Weiß</span>
            </span>
            <span class="meta">#FFFFFF · 255, 255, 255</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #808080">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Gray</span>
              <span class="name de">Grau</span>
            </span>
            <span class="meta">#808080 · 128, 128, 128</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #c0c0c0">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Silver</span>
              <span class="name de">Silber</span>
            </span>
            <span class="meta">#C0C0C0 · 192, 192, 192</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #ffd700">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Gold</span>
              <span class="name de">Gold</span>
            </span>
            <span class="meta">#FFD700 · 255, 215, 0</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #f5f5dc">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Beige</span>
              <span class="name de">Beige</span>
            </span>
            <span class="meta">#F5F5DC · 245, 245, 220</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #40e0d0">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Turquoise</span>
              <span class="name de">Türkis</span>
            </span>
            <span class="meta">#40E0D0 · 64, 224, 208</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #ee82ee">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Violet</span>
              <span class="name de">Violett</span>
            </span>
            <span class="meta">#EE82EE · 238, 130, 238</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #4b0082">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Indigo</span>
              <span class="name de">Indigo</span>
            </span>
            <span class="meta">#4B0082 · 75, 0, 130</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #00ffff">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Cyan</span>
              <span class="name de">Cyan / Zyan</span>
            </span>
            <span class="meta">#00FFFF · 0, 255, 255</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #ff00ff">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Magenta</span>
              <span class="name de">Magenta</span>
            </span>
            <span class="meta">#FF00FF · 255, 0, 255</span>
          </span>
        </button>

        <button class="card" type="button" style="--c: #00ff00">
          <span class="swatch"></span>
          <span class="panel">
            <span class="names">
              <span class="name en">Lime</span>
              <span class="name de">Limette</span>
            </span>
            <span class="meta">#00FF00 · 0, 255, 0</span>
          </span>
        </button>
      </section>
    </main>

    <footer class="page-footer">
      <p>20 colors · click any card to flip · <span id="hint">EN → DE</span></p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
